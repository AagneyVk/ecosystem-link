name: Feature request
description: Propose an improvement to the hub or Android agent.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Permission, privacy, and security impact
      description: Describe new Android permissions, data flows, listeners, or stored data.
    validations:
      required: true

